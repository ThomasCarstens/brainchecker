# The 32 decisions Thomas classified in the protocol form (26 Sep 2026, Section 3), located
# in human_m123 and read against the internship documents (fitting report, CIS report,
# "Performing the Analysis" Google Doc, repo guide).
#
# `form` is his answer and is authoritative for examination. `evidence` is what the
# documents say; a report passage is shown as evidence to confirm, never promoted to
# "examined" on its own: three rows (K28-K30) are written up in a report and he still
# answered "Don't know".
#
# evidence.kind: rationale | check | limitation | own-voice (first person, his working
# notes or "I" in a report) | ai (text that names or quotes the AI) | documented

[[decision]]
id = "K01"
pillar = "modelling"
title = "Every pressure ramp is a quintic smootherstep 6s⁵−15s⁴+10s³ ('a smooth function that Claude implemented')"
where = ["Model_1/Model.jl:825", "Model_1/Model.jl:836", "Model_3/Model.jl:705", "Model_3_celia/Model.jl:691", "Model_1/Elements.jl:809"]
form = "Examined · critical"
evidence = [
  { doc = "Fitting report", at = "§2.3.2, Équ. 2; App. 9 point 2", kind = "rationale", quote = "Smootherstep rather than a step or a linear ramp because the solver is stiff: a discontinuous boundary forces Rodas5P to restart its step-size control at onset, and a C1 ramp still leaves a kink in the derivative. The quintic is C2." },
  { doc = "Code comment", at = "Model_1/Model.jl:836", kind = "ai", quote = "# Using a smooth function that Claude implemented." },
]

